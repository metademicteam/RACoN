<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RACoN Desktop</title>
    <style>
      :root {
        --bg-main: #0d1117;
        --bg-panel: #161b22;
        --border: #30363d;
        --text-primary: #c9d1d9;
        --text-bright: #f0f6fc;
        --text-muted: #8b949e;
        --accent: #58a6ff;
        --success: #3fb950;
        --warning: #d29922;
        --danger: #f85149;
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        background-color: var(--bg-main);
        color: var(--text-primary);
        font-size: 13px;
        line-height: 1.5;
        user-select: none;
        overflow: hidden;
      }
      button {
        cursor: pointer;
        font-family: inherit;
      }
      input, select, textarea {
        font-family: inherit;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
